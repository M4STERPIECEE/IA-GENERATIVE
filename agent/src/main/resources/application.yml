server:
  port: 8080

spring:
  application:
    name: ia-genai-agent

  ai:
    # OpenAI  : AI_API_KEY=sk-...
    # Mistral : AI_API_KEY=... AI_BASE_URL=https://api.mistral.ai/v1 AI_CHAT_MODEL=mistral-large-latest AI_EMBEDDING_MODEL=mistral-embed
    # Ollama  : AI_API_KEY=ollama AI_BASE_URL=http://localhost:11434/v1 AI_CHAT_MODEL=llama3.1 AI_EMBEDDING_MODEL=nomic-embed-text
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:changeme}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 15s
        streamable-http:
          connections:
            mcp-tools:
              url: http://localhost:8081

rag:
  min-similarity: 0.5
  top-k: 4
  vectorstore-path: data/vectorstore.json

logging:
  level:
    com.iagen.agent: DEBUG

version:
  path: v1
