server:
  port: 8080

spring:
  application:
    name: ia-genai-agent

  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:changeme}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 15s
        streamable-http:
          connections:
            mcp-tools:
              url: http://localhost:8081

rag:
  min-similarity: 0.5
  top-k: 4
  vectorstore-path: data/vectorstore.json

logging:
  level:
    com.iagen.agent: DEBUG

version:
  path: v1
